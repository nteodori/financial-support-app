name: Meridian Pay Agent Eval Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      candidate_experiment:
        description: 'Candidate Braintrust experiment name/prefix'
        required: true
        default: 'v2-concise'
      baseline_experiment:
        description: 'Baseline Braintrust experiment name/prefix'
        required: true
        default: 'v1-baseline'

jobs:
  eval-gate:
    name: Braintrust Safety & Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI Regression Gate
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT_NAME: ${{ vars.BRAINTRUST_PROJECT_NAME || 'meridian-pay-support' }}
          BRAINTRUST_ORG_NAME: ${{ vars.BRAINTRUST_ORG_NAME || 'NTeodori' }}
        run: |
          CANDIDATE="${{ github.event.inputs.candidate_experiment || 'v2-concise' }}"
          BASELINE="${{ github.event.inputs.baseline_experiment || 'v1-baseline' }}"
          python scripts/gate.py --experiment "$CANDIDATE" --baseline "$BASELINE"
